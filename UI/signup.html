<!doctype html>

<html>
  <head>
    <title>SignUp</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <div id="navbar"></div>

    <center>
      <h2>Sign Up :</h2>
      <div id="alrt-message" class=""></div>

      <div class="signup_tbl">
        <div class="form">
          <label for="txt_name"><b>Name: </b></label>
          <input type="text" id="txt_name" placeholder="Name" />
        </div>
        <br />
        
        <div class="form">
          <label for="txt_number"><b>Phone Number</b></label>
          <input type="tel" id="txt_ph_num" placeholder="Phone number" />
        </div>
        <br />
        <div class="form">
          <label for="txt_email"><b>Email Address: </b></label>
          <input type="email" id="email" placeholder="email address" />
        </div>
        <br />
        <div class="form">
          <label for="txt_password"><b>Password: </b></label>
          <input type="password" id="txt_password" placeholder="password" />
        </div>
        <button class="success" id="btn_signup">Sign Up</button>

        <p>
          Already have an account?
          <a class="blue_label" href="login.html">Login</a>
        </p>
      </div>
    </center>
  </body>
</html>
