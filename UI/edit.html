<!DOCTYPE html>
<html>
    <head>

        <div id="navbar"> </div>

       <div id="edit_toast"></div>

            <tr>

            </tr>
            <tr>
                <td><label for="category">Category:</label> </td>

            </tr>

                <td><label for="available">Availaibility:</label> </td>
                <td><input type="text" id="available" placeholder="yes/no"></td>
            </tr>
            
            <tr>
                <td><button class="danger" id="btn_clear" onclick="onClear()">Clear</button></td>
               <td> <button class="success" id="btn_add" onclick="showUpdate('Updated Successfully!')">
    Update
</button>
</td>
            </tr>
        </table>
